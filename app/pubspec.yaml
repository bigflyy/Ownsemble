name: ownsemble
description: "Personal, local-first music library and player."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  path: ^1.9.1
  sqlite3: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.5.4

flutter:
  uses-material-design: true

  # Golos Text (SIL Open Font License 1.1, assets/fonts/OFL.txt): the B2
  # design's typeface, bundled so it works offline and on every platform.
  fonts:
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GolosText-Bold.ttf
          weight: 700
